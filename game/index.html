<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP ICT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="game-title">
            <div class="title-text">
                <h1>SCP <span>ICT</span></h1>
                <p class="subtitle">Thắng 10 điểm mới có quà 🎁</p>
            </div>
            <button id="mute" class="mute" aria-label="Bật/tắt âm thanh">🔊</button>
        </header>
        <div class="game-screen">
            <canvas id="game"></canvas>
        </div>
        <p id="description" class="game-description">Nhấn <kbd>Space</kbd> hoặc chạm vào màn hình để bay</p>
    </div>
    <script src="main.js"></script>
</body>
</html>
